[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rebot-arm-sdk"
version = "0.1.0"
description = "Protocol-only Python SDK for the reBot ArmGateway and ArmPlanner gRPC services"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "grpcio>=1.83.1",
  "protobuf>=7.35.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["rebot_sdk*"]

[tool.setuptools.package-data]
rebot_sdk = ["_generated/*.py"]
